name: test

# 测试工作流：main 推送 / PR 触发，同时也是 release 工作流的可复用前置（workflow_call）。
# 只有这里的全部步骤通过，release 工作流才会创建 GitHub Release。

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version consistency (pyproject vs package)
        run: |
          set -eu
          PKG=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("antpwn/__init__.py").read_text(encoding="utf-8")
          print(re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          PROJ=$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          print(re.search(r'^version = "([^"]+)"', text, re.M).group(1))
          PY
          )
          echo "package=$PKG pyproject=$PROJ"
          test "$PKG" = "$PROJ"

      - name: Compile all modules
        run: python3 -m py_compile antpwn.py antpwn/*.py tests/run_all.py

      - name: 32-bit toolchain probe (informational)
        continue-on-error: true
        run: |
          if as --32 /dev/null -o /tmp/x.o 2>/dev/null && \
             ld -m elf_i386 /tmp/x.o -o /tmp/x 2>/dev/null; then
            echo "binutils --32 available"
          else
            echo "binutils --32 unavailable: i386 fixture tests will be skipped"
          fi
          if echo 'int main(void){return 0;}' >/tmp/t.c && \
             gcc -m32 /tmp/t.c -o /tmp/t32 2>/dev/null; then
            echo "gcc -m32 available"
          else
            echo "gcc -m32 unavailable: 32-bit libc fixtures will be skipped"
          fi

      - name: Static analysis smoke (no target process)
        run: |
          set -eu
          python3 antpwn.py analyze challenges/bin/baby_bof > /tmp/analyze.log
          grep -q "PIE" /tmp/analyze.log
          grep -q "bof" /tmp/analyze.log

      - name: View REPL smoke (piped commands)
        run: |
          set -eu
          printf 'info\nvuln\ndisas vuln 32\npseudo vuln\nxrefs vuln\nexport /tmp/view.json\nquit\n' \
            | python3 antpwn.py view challenges/bin/baby_bof > /tmp/view.log
          grep -q "vulnerabilities" /tmp/view.log
          test -s /tmp/view.json

      - name: End-to-end exploit smoke (one challenge)
        run: |
          set -eu
          python3 antpwn.py pwn challenges/bin/baby_bof --no-pheromone --json /tmp/pwn.json > /tmp/pwn.log
          grep -q "已被拿下\|pwned" /tmp/pwn.log
          python3 -c "import json; d=json.load(open('/tmp/pwn.json')); assert d['ok'] is True"

      - name: Unit tests (stdlib unittest)
        run: |
          set -eu
          python3 -m unittest discover -s tests -v

      - name: Docs sanity (no collapsed README / literal \\n)
        run: |
          set -eu
          for f in README.md README.en.md; do
            lines=$(wc -l < "$f")
            test "$lines" -ge 50 || { echo "$f looks collapsed ($lines lines)"; exit 1; }
            if grep -q '\\n' "$f"; then echo "$f contains literal backslash-n"; exit 1; fi
          done
          for f in docs/API.md docs/API.en.md; do
            test -s "$f"
                      python3 - "$f" <<'PY'
          import sys
          text = open(sys.argv[1], encoding="utf-8").read()
          for probe in ("find_all()", "ret"):
              assert probe in text, (sys.argv[1], probe)
          PY
          done


      - name: GDB plugin smoke (real inferior, needs gdb)
        run: |
          set -eu
          if ! command -v gdb >/dev/null 2>&1; then
            echo "gdb not installed on this runner, skipping"
            exit 0
          fi
          bash tests/gdb_smoke.sh

      - name: Package build sanity
        run: |
          python3 -m pip install --quiet build
          python3 -m build --wheel --outdir /tmp/dist >/dev/null
          ls /tmp/dist
