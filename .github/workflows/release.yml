name: release

# 发版：推送 vX.Y.Z 标签触发。
# 1) 先复用 test.yml 跑完整测试（版本一致性 / 编译 / analyze / view / pwn / 单测 / wheel 构建）
# 2) 只有测试全部通过，release job 才运行并创建 GitHub Release；测试失败则什么都不发布。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source archive
        run: |
          set -eu
          mkdir -p dist
          git archive --format=zip \
            --prefix="AntPwn-${GITHUB_REF_NAME}/" \
            -o "dist/AntPwn-${GITHUB_REF_NAME}.zip" HEAD
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "${GITHUB_REF_NAME}" \
            --title "AntPwn ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            "dist/AntPwn-${GITHUB_REF_NAME}.zip"
