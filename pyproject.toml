[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antpwn"
version = "1.6.0"
description = "CTF Pwn analysis assistant: dependency-free ELF analysis, pseudo-code, planning and auto-verification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "guaidao2" }, { name = "coolmoon" }]
keywords = ["ctf", "pwn", "binary-exploitation", "reverse-engineering", "elf", "security-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

[project.urls]
Homepage = "https://github.com/guaidao2/AntPwn"
Repository = "https://github.com/guaidao2/AntPwn"

[project.scripts]
antpwn = "antpwn.cli:main"

[tool.setuptools]
packages = ["antpwn"]
